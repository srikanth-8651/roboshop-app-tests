apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  namespace: roboshop-sit
  labels:
     project: roboshop
     tier: db
     component: rabbitmq
type: Opaque
data:
  RABBITMQ_DEFAULT_USER: cm9ib3Nob3A=
  RABBITMQ_DEFAULT_PASS: cm9ib3Nob3AxMjM=
---
apiVersion: apps/v1
kind: Deployment
metadata: 
 name: rabbitmq
 namespace: roboshop-sit
 labels:
     project: roboshop
     tier: db
     component: rabbitmq   
spec:
 replicas: 1
 selector:

   matchLabels:
      project: roboshop
      tier: db
      component: rabbitmq
    #pod defination
 template:
  metadata:
   labels:
     project: roboshop
     tier: db
     component: rabbitmq
  spec:
   containers:
     - name: rabbitmq
       image: rabbitmq:3
       envFrom:
        - secretRef:
            name: rabbitmq
    
---

apiVersion: v1
kind: Service
metadata: 
 name: rabbitmq
 namespace: roboshop-sit
 labels:
     project: roboshop
     tier: db
     component: rabbitmq
spec:
 selector:
     project: roboshop
     tier: db
     component: rabbitmq
 ports:
  - protocol: TCP
    port: 5672 # service port
    targetPort: 5672 # Target port
   
   