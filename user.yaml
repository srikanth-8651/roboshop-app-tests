apiVersion: v1
kind: ConfigMap
metadata:
 name: user
 namespace: roboshop-dev
data:
  MONGO: "true"
  REDIS_URL: 'redis://redis:6379'
  MONGO_URL: "mongodb://mongodb:27017/users"
---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: user
 namespace: roboshop-dev
spec:
 replicas: 1

 selector:
  matchLabels:
     project: roboshop
     tier: backend
     component: user

 template:
   metadata: 
    labels:
      project: roboshop
      tier: backend
      component: user
   spec:
    containers:
     - name: user
       image: srikanth865/user:v2
       envFrom: #envfrom is list of task doing it may be one or many in list so we give  - 
        - configMapRef:
           name: user
---
apiVersion: v1
kind: Service
metadata:
 name: user
 namespace: roboshop-dev
spec:

 selector:
  #this selector  service labels going to match the user pod labels
     project: roboshop
     tier: backend
     component: user

 ports:
  - protocol: TCP
    port: 8080 #serviceport
    targetPort: 8080  #container port

 