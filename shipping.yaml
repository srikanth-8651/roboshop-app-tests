apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping
  namespace: roboshop-sit
  labels:
    project: roboshop
    tier: backend
    component: shipping
data:
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "mysql"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: roboshop-sit
  labels:
    project: roboshop
    tier: backend
    component: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: shipping
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: shipping
    spec:
      containers:
        - name: shipping
          image: srikanth865/shipping:v1
          ports:
            - name: liveness-port
              containerPort: 8080

          startupProbe:
            httpGet:
              path: /health
              port: liveness-port
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: liveness-port
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: liveness-port
            periodSeconds: 10
            timeoutSeconds: 5

          envFrom:
            - configMapRef:
                name: shipping

---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: roboshop-sit
  labels:
    project: roboshop
    tier: backend
    component: shipping
spec:
  selector:
    project: roboshop
    tier: backend
    component: shipping
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080