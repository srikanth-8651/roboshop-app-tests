apiVersion: v1
kind: ConfigMap
metadata:
 name: shipping
 namespace: roboshop-dev
 labels:
     project: roboshop
     tier: backend
     component: shipping
data:
  CART_ENDPOINT: cart:8080
  DB_HOST: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: shipping
 namespace: roboshop-dev
 labels:
     project: roboshop
     tier: backend
     component: shipping
spec:
 replicas:
 selector:
  matchLabels:
     project: roboshop
     tier: backend
     component: shipping
    
 template:
  metadata:
   labels:
     project: roboshop
     tier: backend
     component: shipping
  spec:
   containers:
    - name: shipping
      image: srikanth865/shipping:v1
      ports:
        - name: liveness-port
          containerPort: 8080
      startupProbe: #is the container done with booting
          httpGet:
            path: /health  #health check
            port: liveness-port
            # we are giving 2 minutes to start the application,if not will say its failure for booting
          failureThreshold: 12
          periodSeconds: 10
      readinessProbe: # this probe say Can I send traffic to it,if shipping not ready,removes that Pod from the Service's available endpoints.
          #k8s is continuously checking wheter pod/container is ready or not
          #This is especially useful because Shipping depends cart&Mysql
          httpGet:
            path: /health
            port: liveness-port
          periodSeconds: 10

      livenessProbe: #Is it still working/alive? 
      #suppose shipping starts successfully, but later the application gets stuck
      #e liveness probe detects that it is no longer healthy, and Kubernetes can restart the container.
          httpGet:
            path: /health
            port: liveness-port
          periodSeconds: 10 
      envFrom:
       - configMapRef:
          name: shipping
          
---
apiVersion: v1
kind: Service
metadata:
 name: shipping
 namespace: roboshop-dev
 labels:
     project: roboshop
     tier: backend
     component: shipping
spec:
 selector:
     project: roboshop
     tier: backend
     component: shipping
 ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080